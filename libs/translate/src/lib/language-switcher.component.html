<mat-form-field appearance="fill">
  <mat-label>Language</mat-label>
  <mat-select [value]="currentLang" (selectionChange)="switchLanguage($event.value)">
    @for (lang of languages; track lang.code) {
      <mat-option [value]="lang.code">
        {{ lang.flag }} {{ lang.name }}
      </mat-option>
    }
  </mat-select>
</mat-form-field>
