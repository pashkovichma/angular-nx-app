<div class="hello">
  @if (user(); as currentUser) {
    <h1 class="hello__title">{{ 'HELLO.TITLE' | translate }}, {{ currentUser.name }}</h1>
  }
  <div class="hello__lang-switcher">
    <lib-translate-language-switcher />
  </div>
</div>
<div class="hello__patient-list">
  @for (patient of patientList(); track patient.id) {
    <app-patient-card [patient]="patient" />
  }
</div>
<router-outlet />
